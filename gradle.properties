# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ============================================================
#  Fabric Mod Properties  --  Minecraft 26.3 "Wilderness Bound"
#  Werte 1:1 aus dem offiziellen Fabric-Example-Mod Branch 26.3
#  https://github.com/FabricMC/fabric-example-mod/tree/26.3
# ============================================================
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Fabric API fuer 26.3
fabric_api_version=0.165.0+26.3

# Mod Properties
mod_version=1.0.0
maven_group=com.chaostobimc.minecraftmusic
archives_base_name=minecraftmusic

# ============================================================
#  Simple Voice Chat (optionale Integration)
#  https://modrepo.de/minecraft/voicechat/api/getting_started
#  API-Version 2.7.0 = die Version, die mit SVC 2.7.0-pre1+26.3
#  ausgeliefert wird. Zum Kompilieren reicht die API-Jar,
#  zur Laufzeit braucht der Server das echte SVC.
# ============================================================
voicechat_api_version=2.7.0

# ============================================================
#  Audio-Stack (LavaPlayer 2.x + youtube-source v2)
#  Wird per Jar-in-Jar in die Mod gebundelt (siehe build.gradle),
#  damit Endnutzer nichts extra installieren muessen.
# ============================================================
lavaplayer_version=2.2.7
youtube_source_version=1.18.2

# Opus-Encoder (pure Java)
concentus_version=1.0.1
