# ---------------------------------------------------------------------------
# MC Music - Gradle properties
# Version info: https://fabricmc.net/develop/
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric (Minecraft 26.3 "Wilderness Bound" is unobfuscated,
# so no mappings entry is required anymore)
minecraft_version=26.3
minecraft_dependency=~26.3
loader_version=0.19.3
fabric_version=0.160.5+26.3
# Loom 1.17.x requires Gradle 9.5+ (see gradle/wrapper/gradle-wrapper.properties)
loom_version=1.17.20

# Simple Voice Chat API (compile time only - provided by the SVC mod at runtime)
voicechat_api_version=2.6.0

# Mod properties
mod_version=1.0.0
maven_group=de.chaostobimc
archives_base_name=mcmusic

# MP3 / audio decoding (bundled into the jar)
mp3spi_version=1.9.5.4
tritonus_version=0.3.7-2
jlayer_version=1.0.1
